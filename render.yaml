# Paid deployment proposal: review the selected plans before applying.
services:
  - type: web
    name: prisma-ml
    runtime: python
    region: frankfurt
    plan: standard
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prisma-db
          property: connectionString
      - key: MODEL_BUNDLE_URL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        value: syncaura-3bb2c.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: syncaura-3bb2c
      - key: FIREBASE_APP_ID
        value: 1:318198876674:web:e716ebc405f86e59ec351b
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: LOKY_MAX_CPU_COUNT
        value: "1"
databases:
  - name: prisma-db
    region: frankfurt
    plan: basic-256mb
    databaseName: prisma
    user: prisma
    ipAllowList: []

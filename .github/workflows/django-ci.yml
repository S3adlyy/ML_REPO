name: Django checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prisma_ci
          POSTGRES_USER: prisma_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisma_ci:ci-only-password@localhost:5432/prisma_ci
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-key-for-isolated-test-runs-not-used-in-deployment-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py check
      - name: Run tests (aucun modèle requis)
        run: python manage.py test --verbosity 2
      - name: Validate migrations and production settings
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          DJANGO_DEBUG=0 python manage.py check --deploy --fail-level WARNING
          DJANGO_DEBUG=0 python manage.py collectstatic --noinput
